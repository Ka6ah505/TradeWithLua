<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор сделок</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1280px;
            margin: 0 auto;
            padding: 20px;
        }
        .trade-block {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            background-color: #f9f9f9;
            width: 100%;
        }
        .trade-block h3 {
            margin-top: 0;
            color: #333;
        }
        .input-group {
            margin-bottom: 10px;
        }
        label {
            display: inline-block;
            width: 180px;
            font-weight: bold;
        }
        input {
            padding: 5px;
            width: 100px;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            background-color: #e9e9e9;
            border-radius: 3px;
        }
        .profit {
            color: green;
        }
        .loss {
            color: red;
        }
        .container {
            display: flex;
            gap: 20px;
        }
    </style>
</head>
<body>
    <h1>Калькулятор сделок</h1>
    <div class="container">
        <div class="trade-block">
            <h3>PLZL</h3>
            <div class="input-group">
                <label for="strategy1">Стратегия:</label>
                <input type="text" disabled id="strategy1" value="top_n_models">
            </div>
            <div class="input-group">
                <label for="entryPrice1">Цена входа (Pуб):</label>
                <input type="number" id="entryPrice1" step="0.01" onchange="calculateTrade(1)">
            </div>
            <div class="input-group">
                <label for="profitPercent1">Профит (%):</label>
                <input type="number" disabled id="profitPercent1" value="3.4" step="0.1" onchange="calculateTrade(1)">
            </div>
            <div class="input-group">
                <label for="lossPercent1">Лосс (%):</label>
                <input type="number" disabled id="lossPercent1" value="2.4" step="0.1" onchange="calculateTrade(1)">
            </div>
            <div class="result">
                <p><strong>Цена по профиту:</strong> <span id="exitProfitPrice1" class="profit">-</span> (<span id="exitProfitPercent1" class="profit">-</span>)</p>
                <p><strong>Цена по лоссу:</strong> <span id="exitLossPrice1" class="loss">-</span> (<span id="exitLossPercent1" class="loss">-</span>)</p>
            </div>
        </div>
        
        <div class="trade-block">
            <h3>SPBE</h3>
            <div class="input-group">
                <label for="strategy2">Стратегия:</label>
                <input type="text" disabled id="strategy2" value="select_top_n_profit_by_trades">
            </div>
            <div class="input-group">
                <label for="entryPrice2">Цена входа (Руб):</label>
                <input type="number" id="entryPrice2" step="0.01" onchange="calculateTrade(2)">
            </div>
            <div class="input-group">
                <label for="profitPercent2">Профит (%):</label>
                <input type="number" disabled id="profitPercent2" value="3.5" step="0.1" onchange="calculateTrade(2)">
            </div>
            <div class="input-group">
                <label for="lossPercent2">Лосс (%):</label>
                <input type="number" disabled id="lossPercent2" value="2.2" step="0.1" onchange="calculateTrade(2)">
            </div>
            <div class="result">
                <p><strong>Цена по профиту:</strong> <span id="exitProfitPrice2" class="profit">-</span> (<span id="exitProfitPercent2" class="profit">-</span>)</p>
                <p><strong>Цена по лоссу:</strong> <span id="exitLossPrice2" class="loss">-</span> (<span id="exitLossPercent2" class="loss">-</span>)</p>
            </div>
        </div>
    </div>
    
    <div class="container">
        <div class="trade-block">
            <h3>GAZP</h3>
            <div class="input-group">
                <label for="strategy3">Стратегия:</label>
                <input type="text" disabled id="strategy3" value="select_top_n_profit_by_trades">
            </div>
            <div class="input-group">
                <label for="entryPrice3">Цена входа (Руб):</label>
                <input type="number" id="entryPrice3" step="0.01" onchange="calculateTrade(3)">
            </div>
            <div class="input-group">
                <label for="profitPercent3">Профит (%):</label>
                <input type="number" disabled id="profitPercent3" value="2.5" step="0.1" onchange="calculateTrade(3)">
            </div>
            <div class="input-group">
                <label for="lossPercent3">Лосс (%):</label>
                <input type="number" disabled id="lossPercent3" value="1.7" step="0.1" onchange="calculateTrade(3)">
            </div>
            <div class="result">
                <p><strong>Цена по профиту:</strong> <span id="exitProfitPrice3" class="profit">-</span> (<span id="exitProfitPercent3" class="profit">-</span>)</p>
                <p><strong>Цена по лоссу:</strong> <span id="exitLossPrice3" class="loss">-</span> (<span id="exitLossPercent3" class="loss">-</span>)</p>
            </div>
        </div>

        <div class="trade-block">
            <h3>LKOH</h3>
            <div class="input-group">
                <label for="strategy4">Стратегия:</label>
                <input type="text" disabled id="strateg4" value="select_top_n_profit_by_trades">
            </div>
            <div class="input-group">
                <label for="entryPrice4">Цена входа (Руб):</label>
                <input type="number" id="entryPrice4" step="0.01" onchange="calculateTrade(4)">
            </div>
            <div class="input-group">
                <label for="profitPercent4">Профит (%):</label>
                <input type="number" disabled id="profitPercent4" value="2.9" step="0.1" onchange="calculateTrade(4)">
            </div>
            <div class="input-group">
                <label for="lossPercent4">Лосс (%):</label>
                <input type="number" disabled id="lossPercent4" value="1.8" step="0.1" onchange="calculateTrade(4)">
            </div>
            <div class="result">
                <p><strong>Цена по профиту:</strong> <span id="exitProfitPrice4" class="profit">-</span> (<span id="exitProfitPercent4" class="profit">-</span>)</p>
                <p><strong>Цена по лоссу:</strong> <span id="exitLossPrice4" class="loss">-</span> (<span id="exitLossPercent4" class="loss">-</span>)</p>
            </div>
        </div>
    </div>

    <script>
        function calculateTrade(tradeNumber) {
            const entryPrice = parseFloat(document.getElementById(`entryPrice${tradeNumber}`).value);
            const profitPercent = parseFloat(document.getElementById(`profitPercent${tradeNumber}`).value);
            const lossPercent = parseFloat(document.getElementById(`lossPercent${tradeNumber}`).value);
            
            if (!isNaN(entryPrice)) {
                // Расчет цен выхода
                const exitProfitPrice = entryPrice * (1 + profitPercent / 100);
                const exitLossPrice = entryPrice * (1 - lossPercent / 100);

                const obj = {
                    "profit": exitProfitPrice.toFixed(2),
                    "loss": exitLossPrice.toFixed(2),
                    "value": entryPrice,
                    "prof_perc": profitPercent,
                    "loss_perc": lossPercent,
                }
                localStorage.setItem(`${tradeNumber}`, JSON.stringify(obj))

            
                // Обновление результатов
                document.getElementById(`exitProfitPrice${tradeNumber}`).textContent = exitProfitPrice.toFixed(2);
                document.getElementById(`exitProfitPercent${tradeNumber}`).textContent = `${profitPercent}%`;
                
                document.getElementById(`exitLossPrice${tradeNumber}`).textContent = exitLossPrice.toFixed(2);
                document.getElementById(`exitLossPercent${tradeNumber}`).textContent = `${lossPercent}%`;
            } else {
                const storage = JSON.parse(localStorage.getItem(`${tradeNumber}`))

                // Обновление результатов
                document.getElementById(`exitProfitPrice${tradeNumber}`).textContent = storage.profit;
                document.getElementById(`exitProfitPercent${tradeNumber}`).textContent = `${profitPercent}%`;
                
                document.getElementById(`exitLossPrice${tradeNumber}`).textContent = storage.loss;
                document.getElementById(`exitLossPercent${tradeNumber}`).textContent = `${lossPercent}%`;

                document.getElementById(`entryPrice${tradeNumber}`).textContent = storage.value;
            }
        }

        function init() {
            for (tradeNumber=1; tradeNumber<5; tradeNumber++){
                console.log(tradeNumber)
                const storage = JSON.parse(localStorage.getItem(`${tradeNumber}`))
                if (storage) {
                    // Обновление результатов
                    document.getElementById(`exitProfitPrice${tradeNumber}`).textContent = storage.profit;
                    document.getElementById(`exitProfitPercent${tradeNumber}`).textContent = `${storage.prof_perc}%`;
                    
                    document.getElementById(`exitLossPrice${tradeNumber}`).textContent = storage.loss;
                    document.getElementById(`exitLossPercent${tradeNumber}`).textContent = `${storage.loss_perc}%`;

                    document.getElementById(`entryPrice${tradeNumber}`).value = storage.value;
                }
            }
        }
        
        // Инициализация расчетов при загрузке
        window.onload = function() {
            init();
        };
    </script>
</body>
</html>
